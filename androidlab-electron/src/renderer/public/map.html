<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Guest-only CSP. This document runs inside an isolated <webview>, so this
    policy is entirely separate from the strict main-window CSP. It accommodates
    the locally-vendored maplibre-gl (script/style 'self'; blob: workers;
    'unsafe-eval' for maplibre expression eval) plus OSM tiles + Nominatim search.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src blob:; child-src blob:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org" />
  <title>map</title>
  <link href="./maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { margin: 0; height: 100%; width: 100%; background: #1e1f22; }
    /* Coordinate readout, bottom-left. */
    #readout {
      position: absolute; left: 10px; bottom: 10px; z-index: 5;
      font: 12px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
      color: #e6e6e6; background: rgba(30,31,34,0.82);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
      padding: 6px 9px; pointer-events: none; letter-spacing: 0.2px;
    }
    #readout b { color: #6cb6ff; font-weight: 600; }
    /* Hint, top-center, fades out. */
    #hint {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5;
      font: 12px -apple-system, system-ui, sans-serif; color: #cfcfcf;
      background: rgba(30,31,34,0.82); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 5px 12px; transition: opacity 0.6s; pointer-events: none;
    }
    /* Place-name search, top-left. */
    #search {
      position: absolute; top: 10px; left: 10px; z-index: 6; width: 240px;
      font: 13px -apple-system, system-ui, sans-serif; color: #e6e6e6;
      background: rgba(30,31,34,0.92); border: 1px solid rgba(255,255,255,0.16);
      border-radius: 7px; padding: 7px 10px; outline: none;
    }
    #search::placeholder { color: #9aa0aa; }
    #search:focus { border-color: #4f8cff; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    #err {
      position: absolute; inset: 0; display: none; place-items: center; z-index: 10;
      font: 13px -apple-system, system-ui, sans-serif; color: #e2554e; text-align: center;
      padding: 24px; background: #1e1f22;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <input id="search" type="text" placeholder="Search a place, then press Enter…" autocomplete="off" />
  <div id="hint">Click the map or drag the pin to choose a location</div>
  <div id="readout"><b>—</b></div>
  <div id="err">Map failed to load.<br>Check your internet connection (map tiles need it).</div>

  <script src="./maplibre-gl.js"></script>
  <script src="./map.js"></script>
</body>
</html>
