appId: com.androidlab.app
productName: MobileLabKit
copyright: Copyright © 2026 Mahmoud Alghraibeh
directories:
  output: dist
  buildResources: build
# Deep ad-hoc sign the packed .app so the (unsigned) bundle isn't reported as
# "damaged" on Apple Silicon. See scripts/afterPackSign.cjs.
afterPack: ./scripts/afterPackSign.cjs
files:
  - out/**/*
  - package.json
  # node-pty is a native module used by the Shell tab — bundle it (vite can't
  # inline a .node binary) and unpack it from the asar so it can be dlopen'd.
  - node_modules/node-pty/**/*
asarUnpack:
  - node_modules/node-pty/**/*
# Bundled into the packaged .app's resources root (process.resourcesPath). Everything
# the app shells out to ships here so the packaged .app is FULLY self-contained — no
# adb / go-ios / scrcpy / OpenSSL install required on the host.
extraResources:
  # Android Debug Bridge — the core Android transport. Universal (x86_64+arm64) binary,
  # standalone. findAdb() resolves resources/platform-tools/adb first when packaged.
  - from: resources/platform-tools/adb
    to: platform-tools/adb
  # Patched go-ios `ios` binary (built from vendor/go-ios via scripts/build-goios.sh).
  # Pure Go / CGO-disabled, so no external dylibs. findGoIos() resolves resources/go-ios/ios.
  - from: resources/go-ios/ios
    to: go-ios/ios
  - from: resources/mocklocation.apk
    to: mocklocation.apk
  # scrcpy's device server (Apache-2.0). It runs ON the device via app_process, so
  # the one jar is platform-independent — bundling it makes the embedded screen
  # mirror (video + control) self-contained with no scrcpy install on the host.
  - from: resources/scrcpy-server
    to: scrcpy-server
  # Android Auto head-unit protocol helper (GPL-3.0, vendor/aa-headunit, staged by
  # `npm run build:aaheadunit`). Pure Node with zero runtime deps — the main process forks
  # aa-headunit/electron-helper.js under utilityProcess; assets/ carries the head-unit TLS
  # credential the main process reads and hands to the helper.
  - from: resources/aa-headunit
    to: aa-headunit
  # Native AirPlay screen-mirror receiver (vendored RPiPlay core, GPL-3.0). Built for
  # macOS/Windows/Linux from native/macos/airplay/* via CMake (`npm run
  # build:airplayhelper`); advertises itself over mDNS with no OS Bonjour/Avahi. The
  # glob picks up whichever the current build produced: `airplayscreen` (mac/linux) or
  # `airplayscreen.exe` (Windows). Drives the Wi-Fi iOS mirror path on every platform.
  # Its OpenSSL/libplist/fdk-aac dylibs are bundled alongside it and the binary's load
  # paths rewritten to @loader_path (see scripts/bundle-mac-dylibs.sh), so the AirPlay
  # Wi-Fi mirror needs no Homebrew install. All ad-hoc signed.
  - from: resources
    to: .
    filter:
      - airplayscreen
      - airplayscreen.exe
      - libcrypto.3.dylib
      - libplist-2.0.4.dylib
      - libfdk-aac.2.dylib
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
  darkModeSupport: true
  minimumSystemVersion: "12.0"
  identity: null
  # The Android Auto head unit captures the Mac's mic to forward voice to the phone
  # (Assistant / voice search) — macOS requires this usage string to prompt for access.
  extendInfo:
    NSMicrophoneUsageDescription: MobileLabKit forwards your microphone to the connected phone for Android Auto voice and Google Assistant.
  # The USB (CoreMediaIO) iOS-screen capture helper is macOS-only (no Windows/Linux
  # equivalent), so it's bundled only in the mac target. Built via `build:ioshelper`.
  extraResources:
    - from: resources/iosscreen
      to: iosscreen
dmg:
  title: MobileLabKit
